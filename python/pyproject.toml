[project]
name = "python-ai-coding"
version = "0.1.0"
description = "Python AI coding scratchpad"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.0",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=8",
]

[tool.ruff]
line-length = 88
target-version = "py313"
# helper.txt is a snippets cheat-sheet, not a runnable module
extend-exclude = ["helper.txt"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# src/ on the path so tests can do `from exercises.<module> import ...`
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
# Mirror pytest's pythonpath so the editor / type checker also resolves
# `exercises.*` imports. pytest config alone doesn't reach Pyright.
extraPaths = ["src"]
# Resolve third-party imports (pytest, pydantic) from the project venv.
venvPath = "."
venv = ".venv"
