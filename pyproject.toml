[project]
name = "python-ai-coding"
version = "0.1.0"
description = "Python AI coding scratchpad"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# helper.py is a snippets cheat-sheet, not a runnable module
extend-exclude = ["helper.py"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
